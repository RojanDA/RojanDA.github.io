<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="idpTitle idpDesc">
  <title id="idpTitle">Document Intelligence Pipeline architecture</title>
  <desc id="idpDesc">A five-stage Databricks pipeline: read PDFs from a Unity Catalog volume, parse with ai_parse_document, classify with ai_classify, extract fields with ai_extract, and write invoices, purchase orders, and receipts into Unity Catalog tables.</desc>
  <defs>
    <marker id="idpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7a99"/>
    </marker>
    <pattern id="idpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5b7a99" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0a0d12"/>
  <rect width="1200" height="675" fill="url(#idpGrid)"/>
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#5b7a99" stroke-opacity="0.35" stroke-width="2"/>

  <text x="70" y="92" font-family="'Space Mono', Consolas, monospace" font-size="15" letter-spacing="4" fill="#7a9bb8">DATABRICKS · AI FUNCTIONS</text>
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#e8e4dc">Document Intelligence Pipeline</text>
  <text x="70" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a8b3bf">From raw PDFs to governed Unity Catalog tables — entirely in SQL.</text>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="70" y="250" width="190" height="128" fill="#141a22" stroke="#5b7a99" stroke-width="2"/>
    <text x="88" y="284" font-family="'Space Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7a9bb8">01 · READ</text>
    <text x="88" y="314" font-size="19" font-weight="700" fill="#e8e4dc">PDF files</text>
    <text x="88" y="340" font-size="13" fill="#a8b3bf">Unity Catalog volume</text>
    <text x="88" y="360" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#7a9bb8">read_files()</text>

    <rect x="300" y="250" width="190" height="128" fill="#141a22" stroke="#5b7a99" stroke-width="2"/>
    <text x="318" y="284" font-family="'Space Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7a9bb8">02 · PARSE</text>
    <text x="318" y="314" font-size="19" font-weight="700" fill="#e8e4dc">ai_parse_document</text>
    <text x="318" y="340" font-size="13" fill="#a8b3bf">elements → text</text>
    <text x="318" y="360" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#7a9bb8">parsed_data</text>

    <rect x="530" y="250" width="190" height="128" fill="#141a22" stroke="#5b7a99" stroke-width="2"/>
    <text x="548" y="284" font-family="'Space Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7a9bb8">03 · CLASSIFY</text>
    <text x="548" y="314" font-size="19" font-weight="700" fill="#e8e4dc">ai_classify</text>
    <text x="548" y="340" font-size="13" fill="#a8b3bf">Invoice · PO · Receipt</text>
    <text x="548" y="360" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#7a9bb8">classify_data</text>

    <rect x="760" y="250" width="190" height="128" fill="#141a22" stroke="#5b7a99" stroke-width="2"/>
    <text x="778" y="284" font-family="'Space Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7a9bb8">04 · EXTRACT</text>
    <text x="778" y="314" font-size="19" font-weight="700" fill="#e8e4dc">ai_extract</text>
    <text x="778" y="340" font-size="13" fill="#a8b3bf">vendor · dates · total</text>
    <text x="778" y="360" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#7a9bb8">Invoice_data</text>

    <rect x="990" y="250" width="140" height="128" fill="#141a22" stroke="#7a9bb8" stroke-width="2"/>
    <text x="1008" y="284" font-family="'Space Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7a9bb8">05 · STORE</text>
    <text x="1008" y="314" font-size="19" font-weight="700" fill="#e8e4dc">Unity</text>
    <text x="1008" y="338" font-size="19" font-weight="700" fill="#e8e4dc">Catalog</text>
    <text x="1008" y="360" font-size="12" fill="#a8b3bf">governed tables</text>
  </g>

  <g stroke="#5b7a99" stroke-width="2" fill="none">
    <line x1="260" y1="314" x2="292" y2="314" marker-end="url(#idpArrow)"/>
    <line x1="490" y1="314" x2="522" y2="314" marker-end="url(#idpArrow)"/>
    <line x1="720" y1="314" x2="752" y2="314" marker-end="url(#idpArrow)"/>
    <line x1="950" y1="314" x2="982" y2="314" marker-end="url(#idpArrow)"/>
  </g>

  <text x="70" y="440" font-family="'Space Mono', Consolas, monospace" font-size="13" letter-spacing="3" fill="#7a9bb8">OUTPUT · idp.finance</text>
  <g font-family="'Space Mono', Consolas, monospace" font-size="14">
    <rect x="70" y="462" width="330" height="58" fill="#141a22" stroke="#5b7a99" stroke-opacity="0.7"/>
    <text x="92" y="497" fill="#e8e4dc">idp.finance.invoices</text>
    <rect x="425" y="462" width="330" height="58" fill="#141a22" stroke="#5b7a99" stroke-opacity="0.7"/>
    <text x="447" y="497" fill="#e8e4dc">idp.finance.purchase_orders</text>
    <rect x="780" y="462" width="330" height="58" fill="#141a22" stroke="#5b7a99" stroke-opacity="0.7"/>
    <text x="802" y="497" fill="#e8e4dc">idp.finance.receipts</text>
  </g>

  <line x1="70" y1="566" x2="1130" y2="566" stroke="#5b7a99" stroke-opacity="0.3"/>
  <text x="70" y="604" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a8b3bf">SQL-native pipeline · no external OCR service · governed by Unity Catalog</text>
  <text x="1130" y="604" text-anchor="end" font-family="'Space Mono', Consolas, monospace" font-size="13" fill="#7a9bb8">DATABRICKS</text>
</svg>
